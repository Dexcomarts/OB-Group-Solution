name: Preview E2E

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Preview or production URL to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-e2e-${{ github.event.deployment_status.target_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'

    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url || inputs.base_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect Node project
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found yet; skipping Playwright gates."
          fi

      - name: Set up Node
        if: steps.project.outputs.has_package == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.project.outputs.has_package == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.project.outputs.has_package == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright smoke tests
        if: steps.project.outputs.has_package == 'true'
        shell: bash
        run: npm run test:e2e --if-present

      - name: Upload Playwright report
        if: always() && steps.project.outputs.has_package == 'true' && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
